name: Codex Code Review
description: Review same-repository pull requests and branch pushes with Codex as the muspi-merol-review GitHub App.
branding:
  icon: eye
  color: gray-dark

inputs:
  codex-config:
    description: Contents of a Codex config.toml whose model provider speaks the Responses API; name it in `codex-config-file` instead to keep it in the repository.
  codex-config-file:
    description: Path in this repository to a Codex config.toml, read from the default branch. `codex-config` takes precedence.
  codex-auth:
    description: Contents of a Codex auth.json, to sign in with ChatGPT instead of an API key; name it in `codex-auth-file` instead to keep it in the repository.
  codex-auth-file:
    description: Path in this repository to a Codex auth.json, read from the default branch. `codex-auth` takes precedence.
  codex-version:
    description: "@openai/codex version to install when the runner has no codex; empty installs the latest."
    default: ""
  bun-version:
    description: Bun version to reuse or install for the Codex launcher and hooks.
    default: 1.4.4
  broker:
    description: Service that exchanges the job's OIDC token for an installation token of the App and relays webhooks.
    default: https://cf-webhook-sse-poc.admin-c9f.workers.dev
  session-key:
    description: Codex session this review continues; one per PR, or per branch for pushes, by default.
  service-tier:
    description: Provider service tier for reviews, such as `ultrafast` where the model advertises it; `default` or empty sends none.
  setup:
    description: Shell to run on the runner before Codex is installed, for tools the review needs; add directories to the PATH through `$GITHUB_PATH`. It runs after Bun is installed, so a proxy or a Bun it provides does not apply to that install.
  instructions:
    description: Instructions appended to the review prompt, for rules specific to this repository.
  model-catalog:
    description: Contents of a Codex model catalog; name it in `model-catalog-file` instead to keep it in the repository.
  model-catalog-file:
    description: Path in this repository to a Codex model catalog, read from the default branch. `model-catalog` takes precedence.

runs:
  using: composite
  steps:
    - id: app-token
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
        DISPATCHED_PR: ${{ github.event.client_payload.pr || github.event.inputs.pr }}
      run: |
        : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Grant the job id-token: write so it can authenticate as the App.}"
        # Tell the broker which execution this token is for, so repository routing can preserve unrelated issue/branch jobs.
        export REVIEW_TARGET=$(jq -r --arg pr "${DISPATCHED_PR:-}" --arg event "$GITHUB_EVENT_NAME" 'if .pull_request or .issue.pull_request or ($pr != "" and $pr != "false") then "pull_request" elif ($event | IN("issues", "issue_comment", "push", "schedule", "workflow_dispatch", "repository_dispatch")) then "other" else "pull_request" end' "$GITHUB_EVENT_PATH")
        mint() {
          oidc=$(bash "$GITHUB_ACTION_PATH/scripts/oidc.sh" "$BROKER")
          curl -sS --fail-with-body --retry 5 -X POST -H "Authorization: Bearer $oidc" -H "X-Review-Target: $REVIEW_TARGET" "$BROKER/token"
        }
        save() { printf 'github.com:\n    user: x-access-token\n    oauth_token: %s\n' "$1" > "$RUNNER_TEMP/gh/hosts.new" && mv "$RUNNER_TEMP/gh/hosts.new" "$RUNNER_TEMP/gh/hosts.yml"; }
        # refill mints, saves the token gh and git read, and schedules the next refresh from the expiry the broker reports.
        refill() { minted=$(mint) || return; if [ "$(jq -r '.skip // false' <<< "$minted")" = true ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; return 2; fi; save "$(jq -r .token <<< "$minted")" && interval=$(( $(jq -r '.expires_at | fromdateiso8601' <<< "$minted") - $(date +%s) )); }
        mkdir -p "$RUNNER_TEMP/gh"
        status=0; refill || status=$?
        [ "$status" != 2 ] || exit 0
        [ "$status" = 0 ] || { echo "::error::Could not initialize installation credentials."; exit 1; }
        token=$(jq -r .token <<< "$minted")
        events_url=$(jq -r .events_url <<< "$minted")
        echo "BOT_LOGIN=$(jq -r .bot <<< "$minted")" >> "$GITHUB_ENV"
        echo "::add-mask::$token"
        echo "::add-mask::$events_url"
        echo "token=$token" >> "$GITHUB_OUTPUT"
        echo "EVENTS_URL=$events_url" >> "$GITHUB_ENV"
        export -f mint save refill
        # Installation tokens expire after an hour, which long reviews and merges waiting for CI outlast, so a background loop keeps the config fresh.
        ( while sleep "$(( interval * 9 / 10 ))"; do
            # A terminal error can end retry.sh immediately. Pause before asking the broker again.
            until interval=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" bash -c 'refill > /dev/null && printf %s "$interval"' < /dev/null); do sleep 30; done
          done ) >> "$RUNNER_TEMP/token.err" 2>&1 &
        echo "TOKEN_PID=$!" >> "$GITHUB_ENV"

    - name: Resolve the review target
      if: steps.app-token.outputs.skip != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        DISPATCHED_PR: ${{ github.event.client_payload.pr || github.event.inputs.pr }}
        DISPATCHED_ISSUE: ${{ github.event.inputs.issue }}
        DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
        DISPATCHED_BASE: ${{ github.event.client_payload.base }}
        SESSION_KEY: ${{ inputs.session-key }}
        CODEX_CONFIG: ${{ inputs.codex-config }}
        CONFIG_FILE: ${{ inputs.codex-config-file }}
      run: |
        # A queued webhook can name an old head; only its PR number remains authoritative.
        number=$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")
        # Two targets would restore one session under the other's group, so a dispatch names one of them.
        [ -z "$DISPATCHED_PR" ] || [ -z "$DISPATCHED_ISSUE" ] || { echo "::error::Name either pr or issue, not both."; exit 1; }
        # The group uses the input verbatim; leading zeros would put the API's canonical number in another group.
        for target in "$DISPATCHED_PR" "$DISPATCHED_ISSUE"; do
          [ -z "$target" ] || [[ "$target" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Use a positive pr or issue number without leading zeros."; exit 1; }
        done
        number=${DISPATCHED_PR:-${DISPATCHED_ISSUE:-$number}}
        # An event on a plain issue is not a review: the agent works on the default branch and decides what, if anything, to do about it.
        agent=$(jq -r 'if .issue and .issue.pull_request == null then "true" else "false" end' "$GITHUB_EVENT_PATH")
        # A manual dispatch carries no issue object, so its input decides: a pull request belongs in `pr`, because its runs share the session group that PR's own runs use.
        if [ -n "$DISPATCHED_ISSUE" ]; then
          has_pr=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/issues/$DISPATCHED_ISSUE" --jq 'has("pull_request")' </dev/null) \
            || { echo "::error::#$DISPATCHED_ISSUE is not readable as an issue."; exit 1; }
          [ "$has_pr" = false ] || { echo "::error::#$DISPATCHED_ISSUE is a pull request; dispatch it with the pr input."; exit 1; }
          agent=true
        fi
        [ "$agent" != true ] || printf 'AGENT=true\nISSUE_NUMBER=%s\n' "$number" >> "$GITHUB_ENV"
        # A queued webhook can name an old head; only its PR number remains authoritative.
        pr=
        [ "$agent" = true ] || [ -z "$number" ] || pr=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/pulls/$number" </dev/null)
        if [ -n "$pr" ]; then
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head.repo.full_name == $repo' <<< "$pr" > /dev/null || { echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::Fork PRs are not reviewed."; }
          jq -r '"PR_NUMBER=\(.number)\nHEAD_SHA=\(.head.sha)\nHEAD_BRANCH=\(.head.ref)\nBASE=\(.base.ref)\nPR_AUTHOR=\(.user.login)"' <<< "$pr" >> "$GITHUB_ENV"
          # The App's own PRs wait until they leave draft, so a half-written fix PR is not reviewed; no workflow has to name this App to get that.
          if [ "$(jq -r .user.login <<< "$pr")" = "$BOT_LOGIN" ] && [ "$(jq -r '.draft // false' <<< "$pr")" = true ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::The App's own PRs wait until they leave draft."
          fi
          SESSION_KEY=${SESSION_KEY:-pr-$(jq .number <<< "$pr")}
        else
          # A deleted branch has no commit to check out, so a `push` trigger must not start a review for it.
          # The expression renders as the string false, not empty, so an emptiness test would skip every push.
          [ "${{ github.event.deleted }}" != "true" ] || { echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::A deleted branch has nothing to review."; }
          # An issue is not a review: its agent works on the default branch whatever ref the dispatch ran on.
          if [ -n "$DISPATCHED_ISSUE" ]; then
            head_branch=${{ github.event.repository.default_branch }}
            head_sha=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/commits/$head_branch" --jq .sha </dev/null)
          else
            # Pushes outside PRs review the pushed branch, and a dispatch names the commit it wants reviewed, which the event's own SHA does not carry.
            head_branch=$GITHUB_REF_NAME head_sha=${DISPATCHED_SHA:-$GITHUB_SHA}
          fi
          printf 'HEAD_SHA=%s\nHEAD_BRANCH=%s\nBASE=%s\n' "$head_sha" "$head_branch" "${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
          # A dispatch may name an older commit, which the session's last head cannot bound.
          [ -z "$DISPATCHED_SHA" ] || printf 'DISPATCHED_SHA=%s\nDISPATCHED_BASE=%s\n' "$DISPATCHED_SHA" "$DISPATCHED_BASE" >> "$GITHUB_ENV"
          # One session per issue, so follow-up comments continue the same conversation.
          if [ "$agent" = true ]; then SESSION_KEY=${SESSION_KEY:-issue-$number}; else SESSION_KEY=${SESSION_KEY:-ref-$GITHUB_REF_NAME}; fi
        fi
        home="${{ runner.temp }}/code-review-homes/${{ github.repository }}/$SESSION_KEY"
        printf 'SESSION_KEY=%s\nCODEX_HOME=%s\n' "$SESSION_KEY" "$home" >> "$GITHUB_ENV"
        # Resolve the config before restoring snapshots, whose names include its model.
        if [ -z "$CODEX_CONFIG" ] && [ -n "$CONFIG_FILE" ]; then
          # The default branch supplies trusted settings; each attempt replaces any failed response.
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" bash -c 'gh api "$1" -H "Accept: application/vnd.github.raw" > "$2"' _ "repos/${{ github.repository }}/contents/$CONFIG_FILE" "$RUNNER_TEMP/config.toml" </dev/null
          CODEX_CONFIG=$(cat "$RUNNER_TEMP/config.toml")
          echo "CODEX_CONFIG_FILE=$RUNNER_TEMP/config.toml" >> "$GITHUB_ENV"
        fi
        # A session belongs to the model that recorded it; resuming it elsewhere is rejected, so each model keeps its own snapshots.
        MODEL=$(sed -n 's/^model *= *"\([^"]*\)".*/\1/p' <<< "$CODEX_CONFIG" | head -1)
        printf 'MODEL_NAME=%s\n' "${MODEL:-default}" >> "$GITHUB_ENV"
        # A reused runner can hold an older snapshot, or one that was never published.
        rm -rf "$home/sessions" "$home/last-thread-id" "$home/check-runs.jsonl" "$home/fork" "$home/snapshot.bin"

    # Session snapshots are encrypted, so Bun must be installed before the first one is restored.
    - name: Reuse the runner's Bun
      id: bun
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        if command -v bun > /dev/null && [ "$(bun --version)" = "$BUN_VERSION" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

    - uses: oven-sh/setup-bun@v2
      if: steps.app-token.outputs.skip != 'true' && (steps.bun.outputs.ready != 'true' && env.SKIP != 'true')
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Find codex session snapshot
      id: snapshot
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/session-artifacts.sh" "$SESSION_KEY"

    - name: Restore codex session
      if: steps.app-token.outputs.skip != 'true' && (steps.snapshot.outputs.id)
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ steps.snapshot.outputs.id }}
        run-id: ${{ steps.snapshot.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ env.CODEX_HOME }}

    - name: Decrypt codex session
      if: steps.app-token.outputs.skip != 'true' && (steps.snapshot.outputs.id)
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: bash "$GITHUB_ACTION_PATH/scripts/snapshot.sh" load "$CODEX_HOME/snapshot.bin" "$CODEX_HOME"

    - name: Restore legacy session cache
      id: session-cache
      if: steps.app-token.outputs.skip != 'true' && (steps.snapshot.outcome == 'success' && !steps.snapshot.outputs.id)
      uses: actions/cache/restore@v6
      with:
        # Branch names may contain "-" but never ":", so the key's prefix matches only this session's snapshots.
        path: |
          ${{ env.CODEX_HOME }}/sessions
          ${{ env.CODEX_HOME }}/last-thread-id
          ${{ env.CODEX_HOME }}/check-runs.jsonl
        # The old shell interpolation stripped the quotes around the configured model.
        key: code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:
          code-review-default-${{ env.SESSION_KEY }}:

    - name: Skip activity another review already handled
      if: steps.app-token.outputs.skip != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # The webhook that started this run also reached any review running at the time, so a consumed event needs no second pass.
        # The workflow sees pull_request_target, but the broker relays the webhook's own pull_request; identity and seeding follow the webhook.
        event=$GITHUB_EVENT_NAME
        [ "$event" != pull_request_target ] || event=pull_request
        echo "EVENT_NAME=$event" >> "$GITHUB_ENV"
        key=$(EVENT_NAME=$event jq -r '[env.EVENT_NAME, (.action // ""), ((if env.GITHUB_EVENT_NAME == "status" then .id else null end) // .comment.id // .review.id // .thread.id // .check_run.id // .check_suite.id // .workflow_run.id // .number // ""), (.after // .check_run.head_sha // .check_suite.head_sha // .workflow_run.head_sha // .sha // .pull_request.head.sha // .client_payload.sha // ""), (.comment.updated_at // .review.submitted_at
          # Successive edits on an unchanged head differ by the text they leave behind and when they landed, which keeps
          # their activity identities distinct even when an edit restores earlier text.
          // (if env.EVENT_NAME == "pull_request" and .action == "edited" then ((.pull_request.title // "") + "\n" + (.pull_request.body // "") + "\n" + (.pull_request.updated_at // "")) else null end)
          // (if env.GITHUB_EVENT_NAME == "workflow_run" and .workflow_run.run_attempt > 1 then .workflow_run.run_attempt else "" end))] | map(tostring) | join(":")' "$GITHUB_EVENT_PATH")
        id=$(printf %s "$key" | sha256sum | cut -c1-40)
        # Thread resolution can repeat with an identical payload; a new triggering run is new activity, while its retries are not.
        [ "$GITHUB_EVENT_NAME" != pull_request_review_thread ] || id="trigger:$GITHUB_RUN_ID"
        echo "ACTIVITY_ID=$id" >> "$GITHUB_ENV"
        # A completed check alone can precede failed PR publication. Only a saved publication checkpoint closes this head.
        published=$(cat "$CODEX_HOME/sessions/.github-published-head" 2>/dev/null || true)
        if [ "$GITHUB_EVENT_NAME" = pull_request_target ] && [ "$(jq -r '.action // empty' "$GITHUB_EVENT_PATH")" = synchronize ] && [ -n "$published" ] && [ "$published" = "$HEAD_SHA" ]; then
          echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::This head was already published."
        fi
        receipts=$CODEX_HOME/sessions/.github-deliveries.json
        # A consumed comment cannot suppress review of a head whose publication never completed.
        case $GITHUB_EVENT_NAME in
          issue_comment|issues|pull_request_review|pull_request_review_comment|pull_request_review_thread)
            if [ -n "$PR_NUMBER" ] && [ -n "$published" ] && [ "$published" = "$HEAD_SHA" ] && [ -f "$receipts" ] && jq -e --arg id "$id" 'index($id)' "$receipts" > /dev/null; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::A running review already took this event."; fi
            # Plain issues reach the agent without a running review, so their activity is authorized here too.
            sender=$(jq -r .sender.login "$GITHUB_EVENT_PATH")
            if [ "$sender" = "$BOT_LOGIN" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::Ignoring the App's own activity."
            else
              permission=$(gh api "repos/${{ github.repository }}/collaborators/$sender/permission" --jq .permission </dev/null 2>/dev/null || echo none)
              case $permission in admin|write|maintain) echo "ACTIVITY_WRITER=true" >> "$GITHUB_ENV" ;; *) echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::$sender may not steer this run." ;; esac
            fi ;;
        esac

    - uses: actions/checkout@v7
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      with:
        token: ${{ steps.app-token.outputs.token }}
        # The commit under review, not its branch: a merged PR's branch is deleted, and a force push moves the name.
        ref: ${{ env.HEAD_SHA }}
        fetch-depth: 0
        persist-credentials: false

    - name: Skip pushes reviewed PRs already cover
      if: steps.app-token.outputs.skip != 'true' && (github.event_name == 'push' && env.SKIP != 'true')
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # A squash or rebase merge lands the reviewed PR head's own tree, so a matching tree means the push brings nothing new.
        base=$BEFORE
        [ ! -f "$CODEX_HOME/check-runs.jsonl" ] || base=$(jq -rs 'map(.sha) | last // env.BEFORE' "$CODEX_HOME/check-runs.jsonl" 2>/dev/null) || base=$BEFORE
        verdict=$(bash "$GITHUB_ACTION_PATH/scripts/covered-push.sh" "$base" "$HEAD_SHA") || exit 0
        # The pushed head keeps a check of its own, borrowing the verdict of the review that covered the same tree.
        conclusion=${verdict%% *} covered=${verdict#* }
        title="Innocent commit"
        [ "$conclusion" != failure ] || title="Blocking defect introduced here"
        bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs -f name=code-review -f head_sha=$HEAD_SHA \
          -f status=completed -f conclusion=$conclusion -f "output[title]=$title" \
          -f "output[summary]=This push lands the tree reviewed at $covered; that review's verdict stands." </dev/null > /dev/null
        # The marker advances the session's reviewed head, so later ranges leave these commits out.
        mkdir -p "$CODEX_HOME"
        jq -cn --arg sha "$HEAD_SHA" '{sha: $sha, id: ""}' >> "$CODEX_HOME/check-runs.jsonl"
        echo "SKIP=true" >> "$GITHUB_ENV"
        echo "RECORDED_SKIP=true" >> "$GITHUB_ENV"
        echo "::notice::$HEAD_SHA lands the tree reviewed at $covered; skipping the review."

    - name: Open check run
      id: check
      if: steps.app-token.outputs.skip != 'true' && (env.AGENT != 'true' && env.SKIP != 'true')
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}?pr=${{ env.PR_NUMBER }}&attempt=${{ github.run_attempt }}
      run: |
        # Reuse an unfinished check run on this head: scripts/open-pr.sh leaves a queued one whose external_id is the session key of the review that opened this PR, and abandoned jobs leave in_progress ones.
        unfinished=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/commits/${{ env.HEAD_SHA }}/check-runs?check_name=code-review" \
          --jq 'first(.check_runs[] | select(.status != "completed")) | "\(.id) \(.external_id // "") \((.details_url // "") | capture("/actions/runs/(?<run>[0-9]+)").run // "") \((.details_url // "") | capture("[?&]attempt=(?<attempt>[0-9]+)").attempt // "")"' </dev/null)
        if [ -n "$unfinished" ]; then
          id=${unfinished%% *}; rest=${unfinished#* }; fork_key=${rest%% *}; rest=${rest#* }; owner=${rest%% *}; owner_attempt=${rest#* }
          # A completed owner left the check behind, and an earlier attempt of this run was interrupted before it could finish; any other live owner still has to be respected.
          if [ -n "$owner" ] && [ "$(GH_TOKEN=${{ github.token }} bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/actions/runs/$owner" --jq .status </dev/null)" != completed ] \
            && ! { [ "$owner" = "$GITHUB_RUN_ID" ] && [ -n "$owner_attempt" ] && [ "$owner_attempt" != "$GITHUB_RUN_ATTEMPT" ]; }; then
            unfinished=
          fi
        fi
        if [ -n "$unfinished" ]; then
          echo "fork-key=$fork_key" >> "$GITHUB_OUTPUT"
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$id -X PATCH -f status=in_progress -f details_url=$DETAILS_URL \
            -f "output[title]=Restoring the Codex session…" -f "output[summary]=Looking for an earlier review to continue." </dev/null > /dev/null
        else
          id=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs -f name=code-review \
            -f head_sha=${{ env.HEAD_SHA }} -f status=in_progress -f details_url=$DETAILS_URL \
            -f "output[title]=Restoring the Codex session…" -f "output[summary]=Looking for an earlier review to continue." --jq .id </dev/null)
        fi
        [ -n "$id" ] || exit 1
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "CHECK_ID=$id" >> "$GITHUB_ENV"

    - name: Mark PR as reviewing
      if: steps.app-token.outputs.skip != 'true' && (env.PR_NUMBER && env.SKIP != 'true')
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        . "$GITHUB_ACTION_PATH/scripts/mark-review.sh"
        printf 'EYES_REACTION_PATH=%s\nEYES_REACTION_ID=%s\n' "$EYES_REACTION_PATH" "$EYES_REACTION_ID" >> "$GITHUB_ENV"

    - name: Subscribe PR updates via SSE
      if: steps.app-token.outputs.skip != 'true' && (env.AGENT != 'true' && env.SKIP != 'true')
      shell: bash
      run: |
        # The webhook that started this run has the shape the broker relays, so the hooks read one stream and dedupe by id.
        mkdir -p "$CODEX_HOME/sessions"
        jq -nr --arg event "${EVENT_NAME:-$GITHUB_EVENT_NAME}" --arg delivery "$ACTIVITY_ID" --argjson writer "${ACTIVITY_WRITER:-false}" --rawfile body "$GITHUB_EVENT_PATH" \
          '"id: \($delivery)\nevent: \($event)\ndata: \(({receivedAt: (now * 1000 | floor), event: $event, delivery: $delivery, body: $body, writer: $writer} | tojson))\n"' > "$RUNNER_TEMP/sse.jsonl"
        # GitHub supplies current state; the subscription only supplies live activity.
        # The runner holds the step open for 5 seconds while a background child keeps its output pipe, so point the subscription at a file.
        bash "$GITHUB_ACTION_PATH/scripts/subscribe.sh" >> "$RUNNER_TEMP/sse.err" 2>&1 &
        echo "SSE_PID=$!" >> "$GITHUB_ENV"

    - name: Find the session to fork
      id: fork-snapshot
      if: steps.app-token.outputs.skip != 'true' && (steps.check.outputs.fork-key && !steps.snapshot.outputs.id && !steps.session-cache.outputs.cache-matched-key && env.SKIP != 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORK_KEY: ${{ steps.check.outputs.fork-key }}
      run: bash "$GITHUB_ACTION_PATH/scripts/session-artifacts.sh" "$FORK_KEY"

    - name: Restore the session to fork
      id: restore-fork
      if: steps.app-token.outputs.skip != 'true' && (steps.fork-snapshot.outputs.id)
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ steps.fork-snapshot.outputs.id }}
        run-id: ${{ steps.fork-snapshot.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ env.CODEX_HOME }}/fork

    - name: Find a replacement session to fork
      id: fork-replacement
      if: steps.app-token.outputs.skip != 'true' && (steps.restore-fork.outcome == 'failure')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORK_KEY: ${{ steps.check.outputs.fork-key }}
        REPLACE_SNAPSHOT_ID: ${{ steps.fork-snapshot.outputs.id }}
      run: |
        # The opener has its own queue and can prune this snapshot during the child's download.
        bash "$GITHUB_ACTION_PATH/scripts/session-artifacts.sh" "$FORK_KEY"
        rm -rf "$CODEX_HOME/fork"

    - name: Restore the replacement session to fork
      id: restore-fork-replacement
      if: steps.app-token.outputs.skip != 'true' && (steps.fork-replacement.outputs.id)
      uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ steps.fork-replacement.outputs.id }}
        run-id: ${{ steps.fork-replacement.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ env.CODEX_HOME }}/fork

    - name: Decrypt the session to fork
      id: decrypt-fork
      if: steps.app-token.outputs.skip != 'true' && (steps.restore-fork.outcome == 'success' || steps.restore-fork-replacement.outcome == 'success')
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      # A fork only adds context; an archive nobody can open must not fail a review that can start without it.
      run: |
        if bash "$GITHUB_ACTION_PATH/scripts/snapshot.sh" load "$CODEX_HOME/fork/snapshot.bin" "$CODEX_HOME/fork" \
          && [ -d "$CODEX_HOME/fork/sessions" ] && [ -s "$CODEX_HOME/fork/last-thread-id" ]; then
          echo "restored=true" >> "$GITHUB_OUTPUT"
        else
          rm -rf "$CODEX_HOME/fork"
          echo "::warning::Could not restore the session to fork. This review starts without it."
        fi

    # Paths are part of the cache version, so a legacy cache restores into the opening review's home.
    - name: Restore the legacy session to fork
      id: fork
      if: steps.app-token.outputs.skip != 'true' && (steps.fork-snapshot.outcome == 'success' && !steps.fork-snapshot.outputs.id)
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/sessions
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/last-thread-id
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/check-runs.jsonl
        key: code-review-${{ env.MODEL_NAME }}-${{ steps.check.outputs.fork-key }}:${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          code-review-${{ env.MODEL_NAME }}-${{ steps.check.outputs.fork-key }}:
          code-review-default-${{ steps.check.outputs.fork-key }}:

    - name: Verify the legacy session to fork
      id: verify-fork
      if: steps.app-token.outputs.skip != 'true' && (steps.fork.outputs.cache-matched-key)
      shell: bash
      env:
        FORK_KEY: ${{ steps.check.outputs.fork-key }}
      run: |
        fork="$RUNNER_TEMP/code-review-homes/$GITHUB_REPOSITORY/$FORK_KEY"
        # A session cached only its check history when its last save was a covered push, so there is no conversation to fork.
        if [ -d "$fork/sessions" ] && [ -s "$fork/last-thread-id" ]; then
          echo "restored=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::The cached session has no conversation to continue. This review starts without it."
        fi

    - name: Run setup
      if: steps.app-token.outputs.skip != 'true' && (inputs.setup != '' && env.SKIP != 'true')
      shell: bash
      env:
        SETUP: ${{ inputs.setup }}
      run: bash -e -c "$SETUP"

    - name: Install uv
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      run: |
        # Everything uv downloads or builds stays under the job's temp directory, so a runner reused by other jobs keeps what it already had.
        printf 'UV_CACHE_DIR=%s\nUV_TOOL_DIR=%s\nUV_PYTHON_INSTALL_DIR=%s\n' "$RUNNER_TEMP/uv/cache" "$RUNNER_TEMP/uv/tools" "$RUNNER_TEMP/uv/python" >> "$GITHUB_ENV"
        if ! command -v uv > /dev/null; then
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$RUNNER_TEMP/uv/bin" UV_NO_MODIFY_PATH=1 sh
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
        fi

    - name: Fetch config files
      id: catalog
      if: steps.app-token.outputs.skip != 'true' && ((inputs.codex-auth-file != '' || inputs.model-catalog-file != '') && env.SKIP != 'true')
      shell: bash
      env:
        AUTH_FILE: ${{ inputs.codex-auth-file }}
        CATALOG_FILE: ${{ inputs.model-catalog-file }}
        CODEX_AUTH: ${{ inputs.codex-auth }}
        CATALOG: ${{ inputs.model-catalog }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # These files configure how Codex runs, so they come from the default branch rather than the change under review.
        mkdir -p "$CODEX_HOME"
        error=$(mktemp)
        catalog=$(mktemp "$CODEX_HOME/models.json.XXXXXX")
        trap 'rm -f "$error" "$catalog"' EXIT
        # Each attempt replaces its file, so an error response cannot prefix a successful retry's body.
        # A 404 is permanent: a file only this branch has becomes a warning, while one nobody has stays a wrong input.
        fetch() {
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" bash -ec '
            if gh api "$1" -H "Accept: application/vnd.github.raw" > "$2" 2> "$3"; then cat "$3" >&2; exit 0; fi
            cat "$3" >&2; rm -f "$2"
            if [ -n "$4" ] && grep -q "HTTP 404" "$3" && git cat-file -e "HEAD:$5" 2> /dev/null; then echo "::warning::$4"; exit 0; fi
            exit 1
          ' _ "repos/${{ github.repository }}/contents/$1" "$2" "$error" "$3" "$1" </dev/null
        }
        [ -n "$CODEX_AUTH" ] || [ -z "$AUTH_FILE" ] || fetch "$AUTH_FILE" "$RUNNER_TEMP/auth.json"
        if [ -z "$CATALOG" ] && [ -n "$CATALOG_FILE" ]; then
          fetch "$CATALOG_FILE" "$catalog" "The model-catalog-file is only on this branch; continuing without the catalog override."
          # Only this download enables the override; a missing file leaves any catalog installed by setup intact.
          if [ -f "$catalog" ]; then
            mv "$catalog" "$CODEX_HOME/models.json"
            echo "loaded=true" >> "$GITHUB_OUTPUT"
          fi
        fi
        [ -z "$AUTH_FILE" ] || echo "CODEX_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"

    - name: Configure codex
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CODEX_CONFIG: ${{ inputs.codex-config }}
        CODEX_AUTH: ${{ inputs.codex-auth }}
        CATALOG: ${{ inputs.model-catalog }}
        # A literal catalog still wins; only a download that landed enables the file.
        MODEL_CATALOG: ${{ inputs.model-catalog || steps.catalog.outputs.loaded }}
        CODEX_VERSION: ${{ inputs.codex-version }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        . "$GITHUB_ACTION_PATH/scripts/configure-review.sh"
        printf 'CODEX_BIN=%s\nCODEX_RUNTIME=%s\nRUNTIME_INFO=%s\n' "$CODEX_BIN" "$CODEX_RUNTIME" "$RUNTIME_INFO" >> "$GITHUB_ENV"
        [ -z "$TRACE_TO_LANGFUSE" ] || echo "TRACE_TO_LANGFUSE=$TRACE_TO_LANGFUSE" >> "$GITHUB_ENV"

    - name: Run codex review
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        FORK_KEY: ${{ (steps.decrypt-fork.outputs.restored == 'true' || steps.verify-fork.outputs.restored == 'true') && steps.check.outputs.fork-key }}
        JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        TRIGGER_SENDER: ${{ github.event.sender.login || 'unknown' }}
        TRIGGER_TYPE: ${{ github.event.sender.type || 'unknown' }}
        LANGFUSE_CODEX_ENVIRONMENT: code-review
        LANGFUSE_CODEX_METADATA: '{"repository": "${{ github.repository }}", "pr": ${{ env.PR_NUMBER || ''null'' }}, "run_id": ${{ github.run_id }}, "head_sha": "${{ env.HEAD_SHA }}"}'
        SERVICE_TIER: ${{ inputs.service-tier }}
        EXTRA_INSTRUCTIONS: ${{ inputs.instructions }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-review.sh"

    - name: Publish check run
      id: publish
      if: steps.app-token.outputs.skip != 'true' && (env.AGENT != 'true' && env.SKIP != 'true')
      shell: bash
      env:
        REVIEW_ACTIONS_TOKEN: ${{ github.token }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: bash "$GITHUB_ACTION_PATH/scripts/publish-check.sh"

    - name: Publish other commit verdicts
      if: steps.app-token.outputs.skip != 'true' && (env.AGENT != 'true' && env.SKIP != 'true')
      shell: bash
      env:
        REVIEW_ACTIONS_TOKEN: ${{ github.token }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: bash "$GITHUB_ACTION_PATH/scripts/publish-commits.sh"

    - name: Publish PR review
      if: steps.app-token.outputs.skip != 'true' && (env.SUPERSEDED != 'true' && env.PR_NUMBER && env.SKIP != 'true')
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: bash "$GITHUB_ACTION_PATH/scripts/publish-pr.sh"

    - name: Finish PR reactions
      if: steps.app-token.outputs.skip != 'true' && (env.SUPERSEDED != 'true' && env.PR_NUMBER && env.SKIP != 'true')
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: bash "$GITHUB_ACTION_PATH/scripts/finish-reactions.sh"

    - name: Write review summary
      if: steps.app-token.outputs.skip != 'true' && (env.SUPERSEDED != 'true' && env.SKIP != 'true')
      shell: bash
      run: |
        # An agent run has no verdict to read, so its closing message is the summary; either way the page says how the run ended.
        if [ "$AGENT" = true ]; then
          summary=$(cat "$RUNNER_TEMP/last-message.md" 2>/dev/null) || summary=
          [ -n "${summary//[[:space:]]/}" ] || summary="This run finished without a closing message."
        else
          summary=$(jq -L "$GITHUB_ACTION_PATH/scripts" -r 'include "summary"; summary_line(.conclusion)' "$RUNNER_TEMP/review.json")
        fi
        printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

    - name: Checkpoint published review
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true')
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/checkpoint-review.sh"

    - name: Encrypt codex session
      id: encrypt-session
      if: steps.app-token.outputs.skip != 'true' && (env.SKIP != 'true' || env.RECORDED_SKIP == 'true')
      # Losing the key must not fail a review that is already published; the older snapshot stays restore-able.
      continue-on-error: true
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: bash "$GITHUB_ACTION_PATH/scripts/snapshot.sh" save "$RUNNER_TEMP/snapshot.bin" "$CODEX_HOME"

    - name: Save codex session
      id: save-session
      if: steps.app-token.outputs.skip != 'true' && (steps.encrypt-session.outcome == 'success')
      # An upload failure must not discard a completed review.
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.snapshot.outputs.name }}
        if-no-files-found: error
        # A rerun can replace an obsolete slot in this run; lookup keeps the newest snapshot in the other slot.
        overwrite: true
        path: ${{ runner.temp }}/snapshot.bin

    - name: Drop older session snapshots
      if: steps.app-token.outputs.skip != 'true' && (steps.save-session.outputs.artifact-id)
      continue-on-error: true
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
        GH_TOKEN: ${{ github.token }}
        SNAPSHOT_ID: ${{ steps.save-session.outputs.artifact-id }}
      run: |
        older=$(bash "$GITHUB_ACTION_PATH/scripts/session-artifacts.sh" "$SESSION_KEY" "$SNAPSHOT_ID")
        [ -n "$older" ] || exit 0
        oidc=$(bash "$GITHUB_ACTION_PATH/scripts/oidc.sh" "$BROKER")
        jq -cn --argjson saved "$SNAPSHOT_ID" --argjson older "$older" '{saved: $saved, older: $older}' \
          | curl -sS --fail-with-body --retry 5 -H "Authorization: Bearer $oidc" --json @- "$BROKER/prune-snapshots"

    - name: Mark forked PRs ready
      # A failed publication skips the snapshot, so the pending list is kept beside the session until every draft is ready.
      # Consumed retries still need to release drafts restored from the session.
      if: steps.app-token.outputs.skip != 'true' && (always())
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        SNAPSHOT_ID: ${{ steps.save-session.outputs.artifact-id }}
      run: |
        [ -n "$CODEX_HOME" ] || exit 0
        opened=$(if [ -f "$RUNNER_TEMP/forked-prs" ]; then cat "$RUNNER_TEMP/forked-prs"; fi) || exit 1
        restored=$(if [ -f "$CODEX_HOME/sessions/.github-pending-drafts" ]; then cat "$CODEX_HOME/sessions/.github-pending-drafts"; fi) || exit 1
        pending=$(printf '%s\n%s\n' "$opened" "$restored" | sed '/^$/d' | sort -u)
        [ -n "$pending" ] || exit 0
        # A draft this run opened can only fork the session it was written into; drafts an earlier run left pending were already waiting after a save.
        if [ -n "$(printf '%s' "$opened" | sed '/^$/d')" ]; then
          listed=false
          [ -z "$SNAPSHOT_ID" ] || listed=$(GH_TOKEN=${{ github.token }} bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/actions/artifacts/$SNAPSHOT_ID" --jq '.expired == false' </dev/null) || listed=false
          [ "$listed" = true ] || { echo "::warning::The session snapshot is unavailable, so drafts this run opened stay draft."; pending=$(comm -23 <(printf '%s\n' "$pending") <(printf '%s\n' "$opened" | sed '/^$/d' | sort -u)); [ -n "$pending" ] || exit 0; }
        fi
        left=
        while read -r url; do
          [ -n "$url" ] || continue
          # A draft closed or released by hand can never become ready here, so it leaves the list instead of being retried on every run.
          draft=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh pr view "$url" --json state,isDraft --jq '.state == "OPEN" and .isDraft' </dev/null) || { left="$left$url"$'\n'; continue; }
          [ "$draft" = true ] || continue
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh pr ready "$url" </dev/null || left="$left$url"$'\n'
        done <<< "$pending"
        if [ -z "$left" ]; then rm -f "$CODEX_HOME/sessions/.github-pending-drafts"; else printf '%s' "$left" > "$CODEX_HOME/sessions/.github-pending-drafts"; fi

    - name: Merge PR
      if: steps.app-token.outputs.skip != 'true' && (env.SUPERSEDED != 'true' && env.PR_NUMBER && env.PR_AUTHOR != env.BOT_LOGIN && env.SKIP != 'true')
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: bash "$GITHUB_ACTION_PATH/scripts/merge-review.sh"

    - name: Encrypt Codex events
      id: encrypt-events
      if: steps.app-token.outputs.skip != 'true' && (always())
      # The events only measure the run; losing them must not fail a review that is already published.
      continue-on-error: true
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: |
        [ -f "$RUNNER_TEMP/codex.jsonl" ] || exit 0
        bash "$GITHUB_ACTION_PATH/scripts/snapshot.sh" save "$RUNNER_TEMP/codex.jsonl.enc" "$RUNNER_TEMP" codex.jsonl
        echo "saved=true" >> "$GITHUB_OUTPUT"

    - name: Upload Codex events
      if: steps.app-token.outputs.skip != 'true' && (always() && steps.encrypt-events.outputs.saved == 'true')
      # The events only measure the run; losing them must not fail a review that is already published.
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: agent-debug-events
        path: ${{ runner.temp }}/codex.jsonl.enc
        if-no-files-found: ignore

    - name: Close check run on failure or cancellation
      if: steps.app-token.outputs.skip != 'true' && ((failure() || cancelled()) && steps.check.outputs.id)
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # A failure after the verdict is published, such as in the PR review, keeps that verdict.
        [ "${{ steps.publish.outcome }}" = success ] || if [ "${{ job.status }}" = cancelled ]; then
          jq -n '{status: "completed", conclusion: "cancelled", output: {title: "Review cancelled", summary: "The run was cancelled before Codex posted a verdict."}}'
        else
          jq -n '{status: "completed", conclusion: "neutral", output: {title: "Review failed", summary: "Codex failed before posting a verdict."}}'
        fi \
          | bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/${{ steps.check.outputs.id }} -X PATCH --input -
        [ -z "$EYES_REACTION_ID" ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$EYES_REACTION_PATH" -X DELETE </dev/null

    - name: Stop the SSE subscription
      if: steps.app-token.outputs.skip != 'true' && (always())
      shell: bash
      run: |
        kill "$SSE_PID" "$TOKEN_PID" 2>/dev/null || true
        tail -3 "$RUNNER_TEMP/sse.err" 2>/dev/null || true
        tail -3 "$RUNNER_TEMP/token.err" 2>/dev/null || true

    - name: Drop the plugin cache
      if: steps.app-token.outputs.skip != 'true' && (always())
      shell: bash
      # Every home syncs its own ~90MB copy of the curated plugins, which self-hosted runners would keep in /tmp.
      # A Resolve failure leaves CODEX_HOME unset, and `rm -rf "/.tmp"` would delete a real directory on a self-hosted runner.
      run: |
        [ -n "$CODEX_HOME" ] || exit 0
        rm -rf "$CODEX_HOME/.tmp"
