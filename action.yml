name: Codex Code Review
description: Review same-repository pull requests and branch pushes with Codex as the muspi-merol-review GitHub App.
branding:
  icon: eye
  color: gray-dark

inputs:
  codex-config:
    description: Contents of a Codex config.toml whose model provider speaks the Responses API.
    required: true
  codex-auth:
    description: Contents of a Codex auth.json, to sign in with ChatGPT instead of an API key.
  codex-version:
    description: "@openai/codex version to install when the runner has no codex."
    default: 0.166.0
  bun-version:
    description: Bun version to reuse or install for the Codex launcher and hooks.
    default: 1.4.4
  broker:
    description: Service that exchanges the job's OIDC token for an installation token of the App and relays webhooks.
    default: https://cf-webhook-sse-poc.admin-c9f.workers.dev
  session-key:
    description: Codex session this review continues; one per PR, or per branch for pushes, by default.
  service-tier:
    description: Provider service tier for reviews, such as `ultrafast` where the model advertises it; `default` or empty sends none.

runs:
  using: composite
  steps:
    - id: app-token
      shell: bash
      env:
        BROKER: ${{ inputs.broker }}
      run: |
        : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Grant the job id-token: write so it can authenticate as the App.}"
        mint() {
          oidc=$(curl -fsS --retry 5 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BROKER" | jq -r .value)
          curl -sS --fail-with-body --retry 5 -X POST -H "Authorization: Bearer $oidc" "$BROKER/token"
        }
        minted=$(mint) || { echo "::error::$minted"; exit 1; }
        token=$(jq -r .token <<< "$minted")
        events_url=$(jq -r .events_url <<< "$minted")
        echo "BOT_LOGIN=$(jq -r .bot <<< "$minted")" >> "$GITHUB_ENV"
        echo "::add-mask::$token"
        echo "::add-mask::$events_url"
        echo "token=$token" >> "$GITHUB_OUTPUT"
        echo "EVENTS_URL=$events_url" >> "$GITHUB_ENV"
        # Installation tokens expire after an hour, which long reviews and merges waiting for CI outlast, so gh and git read the token from a gh config that a background loop keeps fresh.
        save() { printf 'github.com:\n    user: x-access-token\n    oauth_token: %s\n' "$1" > "$RUNNER_TEMP/gh/hosts.new" && mv "$RUNNER_TEMP/gh/hosts.new" "$RUNNER_TEMP/gh/hosts.yml"; }
        mkdir -p "$RUNNER_TEMP/gh"
        save "$token"
        ( while sleep 900; do minted=$(mint) && save "$(jq -r .token <<< "$minted")"; done ) &
        echo "TOKEN_PID=$!" >> "$GITHUB_ENV"

    - name: Resolve the review target
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        DISPATCHED_PR: ${{ github.event.client_payload.pr }}
        DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
        DISPATCHED_BASE: ${{ github.event.client_payload.base }}
        SESSION_KEY: ${{ inputs.session-key }}
      run: |
        # Comments and dispatches name only the PR, so their PR is fetched fresh; other events carry it.
        number=$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH")
        [ -z "$DISPATCHED_PR" ] || number=$DISPATCHED_PR
        # An event on a plain issue is not a review: the agent works on the default branch and decides what, if anything, to do about it.
        agent=$(jq -r 'if .issue and .issue.pull_request == null then "true" else "false" end' "$GITHUB_EVENT_PATH")
        [ "$agent" != true ] || printf 'AGENT=true\nISSUE_NUMBER=%s\n' "$number" >> "$GITHUB_ENV"
        pr=
        [ "$agent" = true ] || pr=$(jq -c '.pull_request // empty' "$GITHUB_EVENT_PATH")
        [ -n "$pr" ] || [ -z "$number" ] || [ "$agent" = true ] || pr=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/pulls/$number" </dev/null)
        if [ -n "$pr" ]; then
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head.repo.full_name == $repo' <<< "$pr" > /dev/null || { echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::Fork PRs are not reviewed."; }
          jq -r '"PR_NUMBER=\(.number)\nHEAD_SHA=\(.head.sha)\nHEAD_BRANCH=\(.head.ref)\nBASE=\(.base.ref)\nPR_AUTHOR=\(.user.login)"' <<< "$pr" >> "$GITHUB_ENV"
          # The App's own PRs wait until they leave draft, so a half-written fix PR is not reviewed; no workflow has to name this App to get that.
          if [ "$(jq -r .user.login <<< "$pr")" = "$BOT_LOGIN" ] && [ "$(jq -r '.draft // false' <<< "$pr")" = true ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::The App's own PRs wait until they leave draft."
          fi
          # A `synchronize` run carries the head change the running review was already told about: a verdict on this head
          # means the commits were reviewed, and a review still in progress will take the change itself.
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ] && [ "$(jq -r '.action // empty' "$GITHUB_EVENT_PATH")" = synchronize ]; then
            head=$(jq -r .head.sha <<< "$pr")
            # A check run another app happens to name the same is not a verdict; the slug keeps this to our own reviews.
            # A run that died before judging leaves a neutral check, which is not a verdict either.
            reviewed=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/commits/$head/check-runs?check_name=code-review" </dev/null 2>/dev/null \
              | jq -r --arg bot "$BOT_LOGIN" '[.check_runs[] | select(.status == "completed" and (.conclusion == "success" or .conclusion == "failure") and .app.slug == ($bot | rtrimstr("[bot]")))] | length') || reviewed=0
            if [ "${reviewed:-0}" != 0 ]; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::This head was already reviewed."; fi
            # Only this workflow's runs count as reviews, and only the job token may read Actions; without that permission the lookup fails open.
            workflow=$(GH_TOKEN=${{ github.token }} gh api "repos/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id </dev/null 2>/dev/null) || workflow=
            branch=$(jq -r .head.ref <<< "$pr")
            running=$(GH_TOKEN=${{ github.token }} gh api "repos/${{ github.repository }}/actions/runs?event=pull_request_target&per_page=100" </dev/null 2>/dev/null \
              | jq -r --arg wf "${workflow:-0}" --arg run "$GITHUB_RUN_ID" --arg branch "$branch" \
                '[.workflow_runs[] | select((.id | tostring) != $run and .status == "in_progress" and (.workflow_id | tostring) == $wf and .head_branch == $branch)] | length') || running=0
            if [ "${running:-0}" != 0 ]; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::Another review of this branch is still running."; fi
          fi
          SESSION_KEY=${SESSION_KEY:-pr-$(jq .number <<< "$pr")}
        else
          # A deleted branch has no commit to check out, so a `push` trigger must not start a review for it.
          # The expression renders as the string false, not empty, so an emptiness test would skip every push.
          [ "${{ github.event.deleted }}" != "true" ] || { echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::A deleted branch has nothing to review."; }
          # Pushes outside PRs review the pushed branch; fixes split into PRs then target the default branch.
          # A dispatch names the commit it wants reviewed, which the event's own SHA does not carry.
          printf 'HEAD_SHA=%s\nHEAD_BRANCH=%s\nBASE=%s\n' "${DISPATCHED_SHA:-$GITHUB_SHA}" "$GITHUB_REF_NAME" "${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
          # A dispatch may name an older commit, which the session's last head cannot bound.
          [ -z "$DISPATCHED_SHA" ] || printf 'DISPATCHED_SHA=%s\nDISPATCHED_BASE=%s\n' "$DISPATCHED_SHA" "$DISPATCHED_BASE" >> "$GITHUB_ENV"
          # One session per issue, so follow-up comments continue the same conversation.
          if [ "$agent" = true ]; then SESSION_KEY=${SESSION_KEY:-issue-$number}; else SESSION_KEY=${SESSION_KEY:-ref-$GITHUB_REF_NAME}; fi
        fi
        printf 'SESSION_KEY=%s\nCODEX_HOME=%s\n' "$SESSION_KEY" "${{ runner.temp }}/code-review-homes/${{ github.repository }}/$SESSION_KEY" >> "$GITHUB_ENV"
        # A session belongs to the model that recorded it; resuming it elsewhere is rejected, so each model keeps its own snapshots.
        MODEL=$(printf '%s\n' "${{ inputs.codex-config }}" | sed -n 's/^model *= *"\([^"]*\)".*/\1/p' | head -1)
        printf 'MODEL_NAME=%s\n' "${MODEL:-default}" >> "$GITHUB_ENV"
        # A reused runner may retain receipts from a snapshot whose upload failed; restore receipts only from the matching session cache.
        rm -f "${{ runner.temp }}/code-review-homes/${{ github.repository }}/$SESSION_KEY/sessions/.github-deliveries.json" "${{ runner.temp }}/code-review-homes/${{ github.repository }}/$SESSION_KEY/sessions/.github-cursor"

    - name: Restore codex session
      id: session-cache
      uses: actions/cache/restore@v6
      with:
        # Branch names may contain "-" but never ":", so the key's prefix matches only this session's snapshots.
        path: |
          ${{ env.CODEX_HOME }}/sessions
          ${{ env.CODEX_HOME }}/last-thread-id
          ${{ env.CODEX_HOME }}/check-runs.jsonl
        key: code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: "code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:"

    - name: Skip activity another review already handled
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # The webhook that started this run also reached any review running at the time, so a consumed event needs no second pass.
        key=$(jq -r '[env.GITHUB_EVENT_NAME, (.action // ""), ((if env.GITHUB_EVENT_NAME == "status" then .id else null end) // .comment.id // .review.id // .thread.id // .check_run.id // .workflow_run.id // .number // ""), (.after // .check_run.head_sha // .workflow_run.head_sha // .sha // .pull_request.head.sha // .client_payload.sha // ""), (.comment.updated_at // .review.submitted_at // (if env.GITHUB_EVENT_NAME == "workflow_run" and .workflow_run.run_attempt > 1 then .workflow_run.run_attempt else "" end))] | map(tostring) | join(":")' "$GITHUB_EVENT_PATH")
        id=$(printf %s "$key" | sha256sum | cut -c1-40)
        # Thread resolution can repeat with an identical payload; a new triggering run is new activity, while its retries are not.
        [ "$GITHUB_EVENT_NAME" != pull_request_review_thread ] || id="trigger:$GITHUB_RUN_ID"
        echo "ACTIVITY_ID=$id" >> "$GITHUB_ENV"
        receipts=$CODEX_HOME/sessions/.github-deliveries.json
        # Only activity is skippable: a queued run for a new head still has code to review.
        case $GITHUB_EVENT_NAME in
          issue_comment|issues|pull_request_review|pull_request_review_comment|pull_request_review_thread)
            if [ -n "$PR_NUMBER" ] && [ -f "$receipts" ] && jq -e --arg id "$id" 'index($id)' "$receipts" > /dev/null; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::A running review already took this event."; fi
            # Plain issues reach the agent without a running review, so their activity is authorized here too.
            sender=$(jq -r .sender.login "$GITHUB_EVENT_PATH")
            if [ "$sender" = "$BOT_LOGIN" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::Ignoring the App's own activity."
            else
              permission=$(gh api "repos/${{ github.repository }}/collaborators/$sender/permission" --jq .permission </dev/null 2>/dev/null || echo none)
              case $permission in admin|write|maintain) echo "ACTIVITY_WRITER=true" >> "$GITHUB_ENV" ;; *) echo "SKIP=true" >> "$GITHUB_ENV"; echo "::notice::$sender may not steer this run." ;; esac
            fi ;;
        esac

    - uses: actions/checkout@v7
      if: env.SKIP != 'true'
      with:
        token: ${{ steps.app-token.outputs.token }}
        # The commit under review, not its branch: a merged PR's branch is deleted, and a force push moves the name.
        ref: ${{ env.HEAD_SHA }}
        fetch-depth: 0
        persist-credentials: false

    - name: Skip pushes reviewed PRs already cover
      if: github.event_name == 'push' && env.SKIP != 'true'
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # A squash or rebase merge lands the reviewed PR head's own tree, so a matching tree means the push brings nothing new.
        base=$BEFORE
        [ ! -f "$CODEX_HOME/check-runs.jsonl" ] || base=$(jq -rs 'map(.sha) | last // env.BEFORE' "$CODEX_HOME/check-runs.jsonl" 2>/dev/null) || base=$BEFORE
        verdict=$(bash "$GITHUB_ACTION_PATH/scripts/covered-push.sh" "$base" "$HEAD_SHA") || exit 0
        # The pushed head keeps a check of its own, borrowing the verdict of the review that covered the same tree.
        conclusion=${verdict%% *} covered=${verdict#* }
        title="No must-fix issue introduced"
        [ "$conclusion" != failure ] || title="Must-fix issue introduced here"
        bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs -f name=code-review -f head_sha=$HEAD_SHA \
          -f status=completed -f conclusion=$conclusion -f "output[title]=$title" \
          -f "output[summary]=This push lands the tree reviewed at $covered; that review's verdict stands." </dev/null > /dev/null
        # The marker advances the session's reviewed head, so later ranges leave these commits out.
        mkdir -p "$CODEX_HOME"
        jq -cn --arg sha "$HEAD_SHA" '{sha: $sha, id: ""}' >> "$CODEX_HOME/check-runs.jsonl"
        echo "SKIP=true" >> "$GITHUB_ENV"
        echo "RECORDED_SKIP=true" >> "$GITHUB_ENV"
        echo "::notice::$HEAD_SHA lands the tree reviewed at $covered; skipping the review."

    - name: Open check run
      id: check
      if: env.AGENT != 'true' && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}?pr=${{ env.PR_NUMBER }}
      run: |
        # Reuse an unfinished check run on this head: scripts/open-pr.sh leaves a queued one whose external_id is the session key of the review that opened this PR, and abandoned jobs leave in_progress ones.
        unfinished=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/commits/${{ env.HEAD_SHA }}/check-runs?check_name=code-review" \
          --jq 'first(.check_runs[] | select(.status != "completed")) | "\(.id) \(.external_id // "")"' </dev/null)
        if [ -n "$unfinished" ]; then
          id=${unfinished% *}
          echo "fork-key=${unfinished#* }" >> "$GITHUB_OUTPUT"
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$id -X PATCH -f status=in_progress -f details_url=$DETAILS_URL \
            -f "output[title]=Restoring the Codex session…" -f "output[summary]=Looking for an earlier review to continue." </dev/null > /dev/null
        else
          id=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs -f name=code-review \
            -f head_sha=${{ env.HEAD_SHA }} -f status=in_progress -f details_url=$DETAILS_URL \
            -f "output[title]=Restoring the Codex session…" -f "output[summary]=Looking for an earlier review to continue." --jq .id </dev/null)
        fi
        [ -n "$id" ] || exit 1
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "CHECK_ID=$id" >> "$GITHUB_ENV"

    - name: Mark PR as reviewing
      if: env.PR_NUMBER && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # The eyes marks the message this run answers: a comment gets its own reaction, while reviews have no reactions endpoint and a deleted comment has nothing to mark.
        subject="issues/$PR_NUMBER/reactions"
        if [ "$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")" != deleted ]; then
          comment=$(jq -r '.comment.id // empty' "$GITHUB_EVENT_PATH")
          case "$GITHUB_EVENT_NAME" in
            issue_comment) [ -z "$comment" ] || subject="issues/comments/$comment/reactions" ;;
            pull_request_review_comment) [ -z "$comment" ] || subject="pulls/comments/$comment/reactions" ;;
          esac
        fi
        id=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$subject" -f content=eyes --jq .id </dev/null) || {
          # A comment can disappear after its webhook was queued; the PR body remains a usable target.
          [ "$subject" != "issues/$PR_NUMBER/reactions" ] || exit 1
          subject="issues/$PR_NUMBER/reactions"
          id=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$subject" -f content=eyes --jq .id </dev/null)
        }
        [ -n "$id" ] || exit 1
        echo "EYES_REACTION_PATH=$subject/$id" >> "$GITHUB_ENV"
        echo "EYES_REACTION_ID=$id" >> "$GITHUB_ENV"

    - name: Subscribe PR updates via SSE
      if: env.AGENT != 'true' && env.SKIP != 'true'
      shell: bash
      run: |
        # The webhook that started this run has the shape the broker relays, so the hooks read one stream and dedupe by id.
        mkdir -p "$CODEX_HOME/sessions"
        jq -nr --arg event "$GITHUB_EVENT_NAME" --arg delivery "$ACTIVITY_ID" --argjson writer "${ACTIVITY_WRITER:-false}" --rawfile body "$GITHUB_EVENT_PATH" \
          '"id: \($delivery)\nevent: \($event)\ndata: \(({receivedAt: (now * 1000 | floor), event: $event, delivery: $delivery, body: $body, writer: $writer} | tojson))\n"' > "$RUNNER_TEMP/sse.jsonl"
        receipts=$CODEX_HOME/sessions/.github-deliveries.json
        cursor=
        [ ! -f "$receipts" ] || cursor=$(jq -r 'map(select(startswith("gap:") | not)) | last // empty' "$receipts")
        [ ! -s "$CODEX_HOME/sessions/.github-cursor" ] || cursor=$(cat "$CODEX_HOME/sessions/.github-cursor")
        : > "$RUNNER_TEMP/sse.cursor"
        # The first connection resumes after the last consumed event, so anything posted between runs reaches this one too; later ones follow what arrived.
        bash "$GITHUB_ACTION_PATH/scripts/subscribe.sh" "$cursor" &
        echo "SSE_PID=$!" >> "$GITHUB_ENV"

    # Paths are part of the cache version, so restore into the opening review's home; the review copies the session from there.
    - name: Restore the session to fork
      id: fork
      if: steps.check.outputs.fork-key && !steps.session-cache.outputs.cache-matched-key && env.SKIP != 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/sessions
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/last-thread-id
          ${{ runner.temp }}/code-review-homes/${{ github.repository }}/${{ steps.check.outputs.fork-key }}/check-runs.jsonl
        key: "code-review-${{ env.MODEL_NAME }}-${{ steps.check.outputs.fork-key }}:"

    - name: Reuse the runner's Bun
      id: bun
      if: env.SKIP != 'true'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        if command -v bun > /dev/null && [ "$(bun --version)" = "$BUN_VERSION" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

    - uses: oven-sh/setup-bun@v2
      if: steps.bun.outputs.ready != 'true' && env.SKIP != 'true'
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install gh-mcp
      if: env.SKIP != 'true'
      shell: bash
      run: |
        # Codex starts the MCP server while it initializes, too early for uvx to resolve the package there.
        export PATH="$HOME/.local/bin:$PATH"
        command -v uv > /dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
        uv tool install --force gh-mcp==0.3.9
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure codex
      if: env.SKIP != 'true'
      shell: bash
      env:
        CODEX_CONFIG: ${{ inputs.codex-config }}
        CODEX_AUTH: ${{ inputs.codex-auth }}
        CODEX_VERSION: ${{ inputs.codex-version }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        [ "$AGENT" = true ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$CHECK_ID -X PATCH \
          -f "output[title]=Setting up Codex…" -f "output[summary]=Installing Codex and the review hooks." </dev/null > /dev/null
        # The checkout keeps no credentials, so git fetches with the refreshed token as well; the empty helper skips credentials the runner's own helpers hold.
        # Reused checkouts already have both helpers; a plain set refuses to overwrite multiple values.
        git config --replace-all credential.https://github.com.helper ""
        git config --add credential.https://github.com.helper "!gh auth git-credential"
        if ! command -v codex > /dev/null; then
          bun install --global "@openai/codex@$CODEX_VERSION"
          export PATH="$(bun pm bin -g):$PATH"
        fi
        CODEX_BIN=$(command -v codex)
        CODEX_RUNTIME=
        # Bun runs the npm launcher, but native binaries and shell wrappers execute directly.
        case "$(file -Lb "$CODEX_BIN")" in *JavaScript*|*Node.js*|*node\ script*) CODEX_RUNTIME=bun ;; esac
        RUNTIME_INFO="Bun $(bun --version); $($CODEX_RUNTIME "$CODEX_BIN" --version)"
        printf 'CODEX_BIN=%s\nCODEX_RUNTIME=%s\nRUNTIME_INFO=%s\n' "$CODEX_BIN" "$CODEX_RUNTIME" "$RUNTIME_INFO" >> "$GITHUB_ENV"
        mkdir -p "$CODEX_HOME"
        printf '%s\n' "$CODEX_CONFIG" > "$CODEX_HOME/config.toml"
        [ -z "$CODEX_AUTH" ] || printf '%s' "$CODEX_AUTH" > "$CODEX_HOME/auth.json"
        cat >> "$CODEX_HOME/config.toml" <<EOF
        [[hooks.PreToolUse]]
        matcher = ".*"
        [[hooks.PreToolUse.hooks]]
        type = "command"
        command = "bash $GITHUB_ACTION_PATH/scripts/review-hook.sh"
        [[hooks.Stop]]
        [[hooks.Stop.hooks]]
        type = "command"
        command = "bash $GITHUB_ACTION_PATH/scripts/review-hook.sh"
        EOF
        # gh-mcp shells out to gh, so it needs the config dir whose hosts.yml the token loop keeps fresh; MCP children only see the variables named here.
        # A codex-config that already names this server keeps its own definition; one that writes mcp_servers as an inline value cannot be extended by a table.
        bun -e '
          const path = process.argv[1], text = await Bun.file(path).text();
          if (Bun.TOML.parse(text).mcp_servers?.gh) process.exit(0);
          const config = text + "\n[mcp_servers.gh]\ncommand = \"gh-mcp\"\nenv_vars = [\"GH_CONFIG_DIR\"]\n";
          try { Bun.TOML.parse(config); }
          catch { console.log("::warning::The supplied config writes mcp_servers inline, so gh-mcp stays out of this run."); process.exit(0); }
          await Bun.write(path, config);
        ' "$CODEX_HOME/config.toml"
        # Trace to Langfuse when the runner or the job provides its keys.
        if [ -n "$LANGFUSE_PUBLIC_KEY" ] || [ -f ~/.codex/langfuse.json ]; then
          curl -fsSL --retry 5 https://registry.npmjs.org/@langfuse/codex-observability-plugin/-/codex-observability-plugin-0.4.3.tgz | tar xz -C "$RUNNER_TEMP"
          printf '[[hooks.Stop.hooks]]\ntype = "command"\ncommand = "bun %s/package/dist/index.mjs"\ntimeout = 30\n' "$RUNNER_TEMP" >> "$CODEX_HOME/config.toml"
          # The plugin is disabled by default and keys do not enable it; only the job's own keys are ours to switch on.
          [ -z "$LANGFUSE_PUBLIC_KEY" ] || echo "TRACE_TO_LANGFUSE=true" >> "$GITHUB_ENV"
        fi

    - name: Run codex review
      if: env.SKIP != 'true'
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        FORK_KEY: ${{ steps.fork.outputs.cache-matched-key && steps.check.outputs.fork-key }}
        JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        TRIGGER_SENDER: ${{ github.event.sender.login || 'unknown' }}
        TRIGGER_TYPE: ${{ github.event.sender.type || 'unknown' }}
        LANGFUSE_CODEX_ENVIRONMENT: code-review
        LANGFUSE_CODEX_METADATA: '{"repository": "${{ github.repository }}", "pr": ${{ env.PR_NUMBER || ''null'' }}, "run_id": ${{ github.run_id }}, "head_sha": "${{ env.HEAD_SHA }}"}'
      run: |
        [ "$AGENT" = true ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$CHECK_ID -X PATCH \
          -f "output[title]=Reviewing…" -f "output[summary]=Codex is reading the diff." </dev/null > /dev/null
        jq -n --arg sha "$HEAD_SHA" --arg id "$CHECK_ID" '{sha: $sha, id: $id}' >> "$CODEX_HOME/check-runs.jsonl"
        # Heads this session reviewed face the review; markers for pushes it skipped only bound the next range.
        COMMITS=$(jq -rs 'map(select(.id != "")) | map(.sha) | unique' "$CODEX_HOME/check-runs.jsonl")
        # Keep consumption receipts inside the existing cache paths without invalidating earlier session snapshots.
        if [ -f "$CODEX_HOME/sessions/.github-deliveries.json" ]; then cp "$CODEX_HOME/sessions/.github-deliveries.json" "$RUNNER_TEMP/injected-deliveries.json"; else printf '[]\n' > "$RUNNER_TEMP/injected-deliveries.json"; fi
        rm -f "$RUNNER_TEMP/injected-cursor"
        if [ "$AGENT" = true ]; then
          SUBJECT="issue #$ISSUE_NUMBER" MENTION="#$ISSUE_NUMBER" COMMENT="gh issue comment $ISSUE_NUMBER --body-file -"
        elif [ -n "$PR_NUMBER" ]; then
          SUBJECT="PR #$PR_NUMBER" MENTION="#$PR_NUMBER" RANGE="origin/$BASE...HEAD" COMMENT="gh pr comment $PR_NUMBER --body-file -"
          MODE_INSTRUCTIONS="If the PR is merged or closed before your review ends, nothing waits for your verdict anymore: point out must-fix issues in a PR comment, editing your latest comment if nothing follows it, and fix certain ones in a separate PR as above rather than on this PR's branch. \
            In the PR title and description, fix only slips you are 100% sure are accidental, such as obvious typos, links or SHAs broken while pasting, stray spaces and unclosed backticks, and never change wording or meaning, except retitle a PR whose title clearly misdescribes the change, such as after commits changed its scope, the way merged PRs here are titled. \
            Edit them via gh api -X PATCH repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER -f title='<title>' or -F body=@-, and reply about it only when useful."
          # A ready PR that no longer merges cleanly still needs someone to merge its base in.
          git merge-tree --write-tree "origin/$BASE" HEAD > /dev/null || CONFLICT="The PR conflicts with $BASE: if it is otherwise ready to merge, run git merge origin/$BASE, resolve the conflicts where the intent of both sides is clear, and commit the merge on its own with commit-fix.sh, passing the resolved paths and a subject like earlier merges in git log, then explain in a PR comment any resolution that is more than keeping both sides; otherwise point out the conflict. "
        else
          SUBJECT="branch $HEAD_BRANCH" MENTION=$HEAD_SHA COMMENT="gh api repos/$GITHUB_REPOSITORY/commits/<sha>/comments -F body=@-"
          # A dispatch names the commit to review, and reviews exactly what it brings: from the base it names, or from its parent.
          if [ -n "$DISPATCHED_SHA" ]; then
            RANGE="${DISPATCHED_BASE:-$(git rev-parse "$HEAD_SHA^")}..HEAD"
          else
            # Pending runs that newer pushes replace never start, so continue from the last head this session reviewed; new branches and force pushes may leave no such commit.
            RANGE="$(jq -rs 'map(.sha) | .[-2] // env.BEFORE' "$CODEX_HOME/check-runs.jsonl")..HEAD"
            git cat-file -e "${RANGE%..HEAD}^{commit}" 2>/dev/null || RANGE="origin/$BASE...HEAD"
          fi
          # Nobody owns a branch push, but the default branch is not ours to rewrite either; other branches accept fixes directly.
          [ "$HEAD_BRANCH" != "$BASE" ] || FIX_POLICY="for certain fixes, open a PR as above rather than committing with commit-fix.sh"
          MODE_INSTRUCTIONS="This review covers pushes to $HEAD_BRANCH outside any PR, so nobody awaits replies: ${FIX_POLICY:-commit certain fixes as usual}, and otherwise stay silent unless a human must act, which should be rare, and then comment on the relevant commit. \
            Commits that landed through a reviewed PR need only a look at what merging could break."
        fi
        # The run script is a template with a 21 kB limit, so the prompts live beside the other scripts.
        . "$GITHUB_ACTION_PATH/scripts/instructions.sh"
        if [ "$AGENT" = true ]; then INSTRUCTIONS="$AGENT_INSTRUCTIONS"; else INSTRUCTIONS="$REVIEW_INSTRUCTIONS"; fi
        # Production reviews may opt into a faster provider tier; workflows that do not ask for one keep the provider default.
        tier=()
        case "${{ inputs.service-tier }}" in
          ''|default) ;;
          *) tier=(--config "service_tier=\"${{ inputs.service-tier }}\"" --config features.ultrafast_mode=true) ;;
        esac
        # An agent turn ends in the actions it took, so it writes no verdict object to parse.
        SCHEMA=(--output-schema "$GITHUB_ACTION_PATH/review-schema.json" --output-last-message "$RUNNER_TEMP/review.json")
        OPEN="Review $SUBJECT: run \`git diff $RANGE\` and inspect the changed files. $CONFLICT$INSTRUCTIONS"
        CONTINUE="Continue reviewing $SUBJECT. The workspace is a fresh checkout at the current HEAD; do not rely on earlier filesystem state or artifacts. Run \`git diff $RANGE\`, \
             re-check what changed, reply to the activity the hooks report, and output the full updated JSON review. $CONFLICT$INSTRUCTIONS"
        if [ "$AGENT" = true ]; then
          SCHEMA=()
          # The event is delivered in the shape the hooks inject into a running review, so both paths read the same context.
          delivery=$(jq -c --arg event "$GITHUB_EVENT_NAME" '{event: $event, action: .action, actor: .sender.login, url: (.issue.html_url // .comment.html_url), comment: .comment.body, comment_id: .comment.id} | with_entries(select(.value != null))' "$GITHUB_EVENT_PATH")
          OPEN=$(printf 'New GitHub activity on %s:\n%s\nRead the issue and its discussion with `gh issue view %s --comments`; the checkout is %s at %s. Decide what response, if any, it calls for and do it. %s' \
            "$SUBJECT" "$delivery" "$ISSUE_NUMBER" "$BASE" "$HEAD_SHA" "$INSTRUCTIONS")
          CONTINUE=$(printf 'New GitHub activity on %s:\n%s\nContinue what you were doing in a fresh checkout at %s; do not rely on earlier filesystem state or artifacts. Re-read the issue if the discussion moved on, finish the response, and reply there. %s' \
            "$SUBJECT" "$delivery" "$HEAD_SHA" "$INSTRUCTIONS")
        fi
        fresh() {
          $CODEX_RUNTIME "$CODEX_BIN" exec --json --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust ${tier[@]+"${tier[@]}"} ${SCHEMA[@]+"${SCHEMA[@]}"} \
            "$OPEN"
        }
        log() { jq --unbuffered -rR --arg stop "$(openssl rand -hex 16)" -f "$GITHUB_ACTION_PATH/scripts/codex-log.jq"; }
        # Hook deliveries never reach the exec stream, so the hook writes them aside and this tail shows them as they land.
        # This writer escapes command syntax instead of stopping commands, since the tool log above holds the runner's one suppression token.
        : > "$RUNNER_TEMP/injected.log"
        tail -f "$RUNNER_TEMP/injected.log" 2> /dev/null | jq --unbuffered -rR -f "$GITHUB_ACTION_PATH/scripts/injected-log.jq" &
        INJECTED_TAIL=$!
        trap 'kill "$INJECTED_TAIL" 2> /dev/null || true' EXIT
        review() {
        if [ -n "$FORK_KEY" ]; then
          fork=${{ runner.temp }}/code-review-homes/${{ github.repository }}/$FORK_KEY
          cp -R "$fork/sessions" "$fork/last-thread-id" "$CODEX_HOME/"
          # The conversation transfers, but events filtered for the source PR were never consumed for this one.
          rm -f "$CODEX_HOME/sessions/.github-cursor" "$CODEX_HOME/sessions/.github-deliveries.json"
          $CODEX_RUNTIME "$CODEX_BIN" exec fork --json --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust ${tier[@]+"${tier[@]}"} \
            --output-schema "$GITHUB_ACTION_PATH/review-schema.json" \
            --output-last-message "$RUNNER_TEMP/review.json" \
            "$(cat "$CODEX_HOME/last-thread-id")" \
            "You opened PR #$PR_NUMBER to keep that fix out of the change you were reviewing; now review it as its own PR. The workspace is a fresh checkout of its head; do not rely on earlier filesystem state or artifacts. \
             Run \`git diff $RANGE\`, inspect the changed files, and output the JSON review for PR #$PR_NUMBER. $INSTRUCTIONS"
        elif [ -f "$CODEX_HOME/last-thread-id" ]; then
          $CODEX_RUNTIME "$CODEX_BIN" exec resume --json --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust ${tier[@]+"${tier[@]}"} ${SCHEMA[@]+"${SCHEMA[@]}"} \
            "$(cat "$CODEX_HOME/last-thread-id")" \
            "$CONTINUE"
        else
          fresh
        fi
        }
        ran=0
        review < /dev/null 2>&1 | tee "$RUNNER_TEMP/codex.jsonl" | log && ran=1
        # A thread recorded under another model or provider cannot be replayed or resumed; its work is lost, the review is not.
        # Only a failed resume itself counts: the same words inside agent output are not a reason to start over.
        if grep -Eq '^(Error: .*|.*"type":"(error|turn\.failed)".*)(unsupported_persisted_item_context|modelProviderMismatch)' "$RUNNER_TEMP/codex.jsonl"; then
          echo "::warning::The saved session cannot continue here; reviewing from a new thread."
          rm -f "$CODEX_HOME/last-thread-id"
          : > "$RUNNER_TEMP/codex.jsonl"
          fresh < /dev/null 2>&1 | tee "$RUNNER_TEMP/codex.jsonl" | log && ran=1
        fi
        # A turn that fails after the review is complete, such as when the provider is at capacity for the next turn, still leaves the verdict it produced.
        [ "$AGENT" = true ] || [ "$ran" = 1 ] || jq -Rrs '[split("\n")[] | fromjson? // empty | select(.type == "item.completed" and .item.type == "agent_message") | .item.text] | last // empty' \
          < "$RUNNER_TEMP/codex.jsonl" > "$RUNNER_TEMP/review.json"
        # Recorded before the verdict check, so a fresh review can resume the thread it just started.
        jq -Rrs '[split("\n")[] | fromjson? // empty | select(.type == "thread.started")] | first | .thread_id' \
          < "$RUNNER_TEMP/codex.jsonl" > "$CODEX_HOME/last-thread-id"
        # A turn can end without a verdict, such as when the model stops to report progress; ask once more and let it name what it still does not know.
        # A commit without a conclusion, or without the one being reviewed, would fail the publish step instead of this one.
        verdict() { jq -e '.summary and (.commits | type == "array" and length > 0) and all(.commits[]; .conclusion == "success" or .conclusion == "failure") and any(.commits[]; .sha == env.HEAD_SHA)' "$RUNNER_TEMP/review.json" > /dev/null 2>&1; }
        if [ "$AGENT" != true ] && ! verdict && [ -s "$CODEX_HOME/last-thread-id" ]; then
          # A capacity error leaves the thread intact but clears on its own schedule; one pause is cheaper than a failed review.
          if grep -Eq 'capacity|overloaded|too many requests' "$RUNNER_TEMP/codex.jsonl"; then sleep 30; fi
          echo "::warning::Codex ended without a verdict; asking for the review object once."
          $CODEX_RUNTIME "$CODEX_BIN" exec resume --json --dangerously-bypass-approvals-and-sandbox --dangerously-bypass-hook-trust ${tier[@]+"${tier[@]}"} \
            --output-schema "$GITHUB_ACTION_PATH/review-schema.json" \
            --output-last-message "$RUNNER_TEMP/review.json" \
            "$(cat "$CODEX_HOME/last-thread-id")" \
            "Reply with the full review JSON for $SUBJECT now, running no further commands, with every field named as in $GITHUB_ACTION_PATH/review-schema.json. Put whatever remains unknown into the summary and judge on what you verified." \
            < /dev/null 2>&1 | tee -a "$RUNNER_TEMP/codex.jsonl" | jq --unbuffered -rR --arg stop "$(openssl rand -hex 16)" -f "$GITHUB_ACTION_PATH/scripts/codex-log.jq"
        fi
        # Tokens spent on this run, summed over every turn the hooks and the extra ask started.
        usage=$(jq -Rrs '[split("\n")[] | fromjson? // empty | select(.type == "turn.completed") | .usage] | "\(map(.input_tokens) | add // 0) input (\(map(.cached_input_tokens) | add // 0) cached), \(map(.output_tokens) | add // 0) output, \(map(.reasoning_output_tokens) | add // 0) reasoning"' \
          < "$RUNNER_TEMP/codex.jsonl")
        echo "::notice::ChatGPT usage: $usage"
        [ "$AGENT" != true ] || [ "$ran" = 1 ] || { echo "::error::Codex failed before completing the issue run."; exit 1; }
        [ "$AGENT" = true ] || verdict || { echo "::error::Codex returned no verdict: $(head -c 300 "$RUNNER_TEMP/review.json" 2>/dev/null)"; exit 1; }
        jq '.[-200:]' "$RUNNER_TEMP/injected-deliveries.json" > "$CODEX_HOME/sessions/.github-deliveries.json"
        [ ! -s "$RUNNER_TEMP/injected-cursor" ] || cp "$RUNNER_TEMP/injected-cursor" "$CODEX_HOME/sessions/.github-cursor"
        [ "$AGENT" = true ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$CHECK_ID -X PATCH \
          -f "output[title]=Saving the Codex session…" -f "output[summary]=The verdict is posted once the session is cached for the next review." </dev/null > /dev/null

    - name: Save codex session
      id: save-session
      if: env.SKIP != 'true' || env.RECORDED_SKIP == 'true'
      # A cache upload failure must not discard a completed review.
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: |
          ${{ env.CODEX_HOME }}/sessions
          ${{ env.CODEX_HOME }}/last-thread-id
          ${{ env.CODEX_HOME }}/check-runs.jsonl
        key: code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:${{ github.run_id }}-${{ github.run_attempt }}

    - name: Drop older session snapshots
      if: steps.save-session.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: code-review-${{ env.MODEL_NAME }}-${{ env.SESSION_KEY }}:${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        # Each snapshot holds the whole session, so keep only the one just saved, once it is listed.
        bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/actions/caches?key=code-review-$MODEL_NAME-$SESSION_KEY:&per_page=100" \
          --jq 'if any(.actions_caches[]; .key == env.KEY) then .actions_caches[].key | select(. != env.KEY) else empty end' </dev/null \
          | while read -r key; do bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api -X DELETE "repos/${{ github.repository }}/actions/caches?key=$key" </dev/null > /dev/null; done

    - name: Mark forked PRs ready
      if: always() && env.FORKED_PRS && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        while read -r url; do bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh pr ready "$url" </dev/null; done < "$RUNNER_TEMP/forked-prs"

    - name: Publish check run
      id: publish
      if: env.AGENT != 'true' && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        PUSHED=$(jq -Rrs '[split("\n")[] | select(startswith("data: ")) | .[6:] | fromjson? // empty | .event as $event | .body | fromjson
          | select(if env.PR_NUMBER then $event == "pull_request" and .number == (env.PR_NUMBER | tonumber) and .action == "synchronize" and .after != null else $event == "push" and .ref == env.GITHUB_REF end)
          | .after] | .[]' < "$RUNNER_TEMP/sse.jsonl")
        # Pushes made with GITHUB_TOKEN, such as CI autofixes, start no workflow, so this review covers them instead of leaving them to a newer run.
        # CI may push before this run subscribes, so whether a run exists tells them apart, not the push sender.
        for sha in $(git rev-parse HEAD) $PUSHED; do
          if [ "$sha" = "$HEAD_SHA" ]; then continue; fi
          [ "$(GH_TOKEN=${{ github.token }} bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha" \
            --jq 'any(.workflow_runs[]; .name == env.GITHUB_WORKFLOW)' </dev/null)" = true ] || continue
          # The stream resumes from a cursor, so it replays pushes from before this run too; only a commit ahead of HEAD supersedes this review.
          if [ "$(GH_TOKEN=${{ github.token }} bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/compare/$HEAD_SHA...$sha" \
            --jq .status </dev/null)" = ahead ]; then NEWER=$sha; fi
        done
        if [ -n "$NEWER" ]; then
          echo "SUPERSEDED=true" >> "$GITHUB_ENV"
          # A check left in progress would wait forever on a commit nothing will finish reviewing.
          # Neutral, not cancelled: GitHub counts a cancelled check as a failing one in the merge box, and this commit simply has a successor.
          jq -n --arg newer "$NEWER" '{status: "completed", conclusion: "neutral", output: {
            title: ("Superseded by " + $newer[0:7] + " — review continues there"),
            summary: "A newer commit was pushed during this review, so no verdict is posted for this commit."}}' \
            | bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/${{ steps.check.outputs.id }} -X PATCH --input -
          # The run that continues on the newer commit keeps its own reaction; this one is done waiting.
          [ -z "$EYES_REACTION_ID" ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$EYES_REACTION_PATH" -X DELETE </dev/null
          exit 0
        fi
        jq -n --arg sha "$HEAD_SHA" --argjson review "$(cat "$RUNNER_TEMP/review.json")" '
        ($review.commits[] | select(.sha == $sha)) as $commit | {
        name: "code-review", head_sha: $sha, status: "completed",
        conclusion: $commit.conclusion,
        output: {
          title: (if $commit.conclusion == "failure" then "Must-fix issue introduced here" else "No must-fix issue introduced" end),
          summary: $review.summary,
          annotations: [$review.annotations[:50][] | {path, start_line: .line, end_line: .line, annotation_level: .level, message}]
        }}' | bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/${{ steps.check.outputs.id }} -X PATCH --input -

    - name: Publish other commit verdicts
      if: env.AGENT != 'true' && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        jq -c --arg head "$HEAD_SHA" '.commits[] | select(.sha != $head)' "$RUNNER_TEMP/review.json" | while read -r verdict; do
          sha=$(jq -r .sha <<< "$verdict")
          conclusion=$(jq -r .conclusion <<< "$verdict")
          id=$(jq -rs --arg sha "$sha" 'map(select(.sha == $sha)) | last | .id // empty' "$CODEX_HOME/check-runs.jsonl")
          # The newer review covers reviewed heads and commits with their own runs, but not commits CI pushed during this one.
          if [ "$SUPERSEDED" = true ]; then [ -z "$id" ] && [ "$(GH_TOKEN=${{ github.token }} bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha" \
            --jq 'any(.workflow_runs[]; .name == env.GITHUB_WORKFLOW)' </dev/null)" != true ] || continue; fi
          # A superseded review may have already posted verdicts for commits CI pushed during it.
          [ -n "$id" ] || [ "$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/commits/$sha/check-runs?check_name=code-review" --jq .total_count </dev/null)" = 0 ] || continue
          # Commits CI pushed during the review have no check run yet.
          jq -n --arg sha "$sha" --arg conclusion "$conclusion" --arg summary "$(jq -r .summary "$RUNNER_TEMP/review.json")" '{name: "code-review", head_sha: $sha, status: "completed", conclusion: $conclusion, output: {
            title: (if $conclusion == "failure" then "Must-fix issue introduced here" else "No must-fix issue introduced" end), summary: $summary}}' \
            | if [ -n "$id" ]; then jq 'del(.head_sha)' | bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/$id -X PATCH --input -
              else bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs --input - > /dev/null; fi
        done

    - name: Publish PR review
      if: env.SUPERSEDED != 'true' && env.PR_NUMBER && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # Reviews carry only the verdict; Codex posts everything else as regular PR comments. GitHub rejects APPROVE and REQUEST_CHANGES on the App's own PRs.
        REVIEWS=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews?per_page=100" </dev/null)
        LAST=$(jq -r '[.[] | select(.user.login == env.BOT_LOGIN and .state != "COMMENTED")] | last | .state // ""' <<< "$REVIEWS")
        # The App's own PRs get a COMMENT review instead of a change request, and the verdict above skips those, so repeat runs need the body to tell they already said it.
        LAST_COMMENT=$(jq -r '[.[] | select(.user.login == env.BOT_LOGIN and .state == "COMMENTED")] | last | .body // ""' <<< "$REVIEWS")
        # A comment rarely changes the verdict, and repeating a change request would duplicate its threads.
        # Review comments must sit inside diff hunks, so must-fix issues elsewhere go into the body as permalinks, which GitHub renders as snippets.
        HUNKS=$(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" --paginate \
          --jq '.[] | {(.filename): [.patch // "" | scan("@@ -\\d+(?:,\\d+)? \\+(\\d+)(?:,(\\d+))? @@") | (.[0] | tonumber) as $start | [$start, $start + (.[1] // "1" | tonumber)]]}' </dev/null | jq -cs add)
        jq -n --argjson review "$(cat "$RUNNER_TEMP/review.json")" --argjson hunks "$HUNKS" --arg blob "$GITHUB_SERVER_URL/${{ github.repository }}/blob/$(git rev-parse HEAD)" \
          --arg author "$PR_AUTHOR" --arg last "$LAST" --arg lastComment "$LAST_COMMENT" '
          def in_diff: .line as $line | any($hunks[.path][]?; .[0] <= $line and $line < .[1]);
          if $review.conclusion == "failure" and $last == "CHANGES_REQUESTED"
             and (env.GITHUB_EVENT_NAME | IN("issue_comment", "pull_request_review", "pull_request_review_comment", "pull_request_review_thread", "repository_dispatch")) then empty
          elif $review.conclusion == "failure" then [$review.annotations[] | select(.level == "failure")] as $issues
            | ([$review.summary, ($issues[] | select(in_diff | not) | "\(.message)\n\($blob)/\(.path)#L\(.line)")] | join("\n\n")) as $body
            | if $lastComment != "" and $body == $lastComment then empty else {
            event: (if $author == env.BOT_LOGIN then "COMMENT" else "REQUEST_CHANGES" end),
            body: $body,
            comments: [$issues[] | select(in_diff) | {path, line, side: "RIGHT", body: .message}]} end
          elif $author == env.BOT_LOGIN or $last == "APPROVED" then empty
          else {event: "APPROVE"} end' > "$RUNNER_TEMP/pr-review.json"
        [ ! -s "$RUNNER_TEMP/pr-review.json" ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews --input "$RUNNER_TEMP/pr-review.json" </dev/null

    - name: Finish PR reactions
      if: env.SUPERSEDED != 'true' && env.PR_NUMBER && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # Replace only this bot's reactions; earlier verdicts must not leave contradictory signals behind.
        bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/reactions?per_page=100" --paginate </dev/null \
          | jq -r --slurpfile review "$RUNNER_TEMP/review.json" '.[] | select(.user.login == env.BOT_LOGIN) | select(.content as $content | $review[0].reactions | index($content) | not) | .id' \
          | while read -r id; do bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/issues/$PR_NUMBER/reactions/$id -X DELETE </dev/null; done
        # A comment's eyes is not part of the verdict reactions replaced below.
        [ -z "$EYES_REACTION_ID" ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$EYES_REACTION_PATH" -X DELETE </dev/null
        echo "EYES_REACTION_PATH=" >> "$GITHUB_ENV"
        echo "EYES_REACTION_ID=" >> "$GITHUB_ENV"
        jq -r '.reactions | unique[]' "$RUNNER_TEMP/review.json" | while read -r reaction; do
          bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/issues/$PR_NUMBER/reactions -f content="$reaction" </dev/null
        done

    - name: Write review summary
      if: env.AGENT != 'true' && env.SUPERSEDED != 'true' && env.SKIP != 'true'
      shell: bash
      run: |
        jq -r .summary "$RUNNER_TEMP/review.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Merge PR
      if: env.SUPERSEDED != 'true' && env.PR_NUMBER && env.PR_AUTHOR != env.BOT_LOGIN && env.SKIP != 'true'
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
        JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        # The wait identifies this workflow's other runs, which the App token cannot list.
        ACTIONS_TOKEN: ${{ github.token }}
      run: |
        merge=$(jq -c 'select(.conclusion == "success") | .merge // empty' "$RUNNER_TEMP/review.json")
        [ -n "$merge" ] || exit 0
        # The shared wait excludes this job's own check runs, wakes on the SSE stream and gives up at WAIT_CI_TIMEOUT instead of holding the runner.
        # A repository with no other checks still merges, as it did before the wait moved into the script.
        WAIT_CI_ALLOW_EMPTY=1 bash "$GITHUB_ACTION_PATH/scripts/wait-ci.sh" "$HEAD_SHA" '.' pass || { echo "::notice::Not merging: checks did not all pass in time."; exit 0; }
        # A push (such as a formatter) or a person can move the branch or close the PR while the review runs; merging then would land code no review saw, or fail on a closed PR.
        read -r state head < <(bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha' </dev/null)
        [ "$state" = open ] || { echo "::notice::Not merging: the pull request is $state."; exit 0; }
        [ "$head" = "$HEAD_SHA" ] || { echo "::notice::Not merging: the branch moved past $HEAD_SHA to $head."; exit 0; }
        bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh pr merge "$PR_NUMBER" --$(jq -r .method <<< "$merge") --subject "$(jq -r .subject <<< "$merge")" --body "$(jq -r .body <<< "$merge")" --match-head-commit "$HEAD_SHA" </dev/null

    - name: Upload Codex events
      if: always()
      # The events only measure the run; losing them must not fail a review that is already published.
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: codex-events
        path: ${{ runner.temp }}/codex.jsonl
        if-no-files-found: ignore

    - name: Close check run on failure or cancellation
      if: (failure() || cancelled()) && steps.check.outputs.id
      shell: bash
      env:
        GH_CONFIG_DIR: ${{ runner.temp }}/gh
      run: |
        # A failure after the verdict is published, such as in the PR review, keeps that verdict.
        [ "${{ steps.publish.outcome }}" = success ] || if [ "${{ job.status }}" = cancelled ]; then
          jq -n '{status: "completed", conclusion: "cancelled", output: {title: "Review cancelled", summary: "The run was cancelled before Codex posted a verdict."}}'
        else
          jq -n '{status: "completed", conclusion: "neutral", output: {title: "Review failed", summary: "Codex failed before posting a verdict."}}'
        fi \
          | bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api repos/${{ github.repository }}/check-runs/${{ steps.check.outputs.id }} -X PATCH --input -
        [ -z "$EYES_REACTION_ID" ] || bash "$GITHUB_ACTION_PATH/scripts/retry.sh" gh api "repos/${{ github.repository }}/$EYES_REACTION_PATH" -X DELETE </dev/null

    - name: Stop the SSE subscription
      if: always()
      shell: bash
      run: |
        kill "$SSE_PID" "$TOKEN_PID" 2>/dev/null || true
        tail -3 "$RUNNER_TEMP/sse.err" 2>/dev/null || true

    - name: Drop the plugin cache
      if: always()
      shell: bash
      # Every home syncs its own ~90MB copy of the curated plugins, which self-hosted runners would keep in /tmp; the session is already cached.
      # A Resolve failure leaves CODEX_HOME unset, and `rm -rf "/.tmp"` would delete a real directory on a self-hosted runner.
      run: |
        [ -n "$CODEX_HOME" ] || exit 0
        rm -rf "$CODEX_HOME/.tmp"
