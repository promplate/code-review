name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    # A labeled issue wakes the agent, which decides how to respond rather than reviewing anything.
    types: [labeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  id-token: write

jobs:
  authorize:
    # The review group holds 100 pending runs and cancels the next one, so a stream of comments the action would
    # skip must never take a slot there: it could push a new head's review out of the queue.
    # External commenters cannot hold write access, so their events must not start a runner to find that out.
    if: >
      github.event_name != 'issue_comment' && github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment'
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    outputs:
      writer: ${{ steps.check.outputs.writer }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            issue_comment|pull_request_review|pull_request_review_comment)
              # A 404 is a denial rather than a failure; one failure should not silently drop an authorized review.
              permission=$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission 2>/dev/null) \
                || permission=$(gh api "repos/${{ github.repository }}/collaborators/$SENDER/permission" --jq .permission 2>/dev/null) \
                || { echo "::warning::Could not read $SENDER's repository permission; skipping this trigger."; permission=none; }
              case "$permission" in admin|write|maintain) echo writer=true ;; *) echo writer=false ;; esac ;;
            # A same-repository push or pull request already required write access.
            *) echo writer=true ;;
          esac >> "$GITHUB_OUTPUT"

  review:
    needs: authorize
    # Same-repository PRs, plus pushes to main so merged work is reviewed too; the App's own PRs wait until they leave draft.
    if: >
      needs.authorize.outputs.writer == 'true' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event.issue.state == 'open'
      || (github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot')))
    concurrency:
      # Keep the active review consuming SSE while later events wait to reconcile its saved session.
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      queue: max
    # Low-trust events such as pull_request_target cannot save caches by default, which would drop every session snapshot.
    cache-mode: write
    runs-on: ubuntu-latest
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
