name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issues:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review.
      issue:
        description: Issue number to hand the agent; a pull request belongs in `pr`.

permissions:
  actions: write
  id-token: write

jobs:
  authorize:
    # The review group holds 100 pending runs and cancels the next one, so a stream of comments the action would
    # skip must never take a slot there: it could push a new head's review out of the queue.
    uses: $/.github/workflows/authorize.yml

  review:
    needs: authorize
    # Same-repository PRs, plus pushes to main so merged work is reviewed too; the App's own PRs wait until they leave draft.
    if: >
      needs.authorize.outputs.writer == 'true' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event.issue.state == 'open'
      || (github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action != 'ready_for_review' || github.event.pull_request.user.type == 'Bot')))
    concurrency:
      # Keep the active review consuming SSE while later events wait to reconcile its saved session.
      # A dispatch names the same target a webhook would, so its group has to match that target's own runs.
      group: code-review-${{ github.event.inputs.pr || github.event.inputs.issue || github.event.pull_request.number || github.event.issue.number || github.ref }}
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
