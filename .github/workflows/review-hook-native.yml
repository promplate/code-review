name: Verify the complete review suite

on:
  push:
    branches: [validate/review-hook-lock-native]

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7d369c64a5a95048124bbed36d8be434d1245755
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Run every Bun test on the PR commit
        shell: bash
        run: |
          git rev-parse HEAD
          bun --version
          gh --version
          env -u AGENT bun test
