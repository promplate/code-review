name: review

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the permission check and the review.
        type: string
        default: ubuntu-latest
      authorize:
        description: Only repository writers may wake the agent. Checked before the run joins the review queue.
        type: boolean
        default: true
      service-tier:
        description: Provider service tier for reviews, such as `ultrafast` where the model advertises it.
        type: string
        default: ""
      session-key:
        description: Codex session this run continues; one per PR, or per branch for pushes, by default.
        type: string
        default: ""
    secrets:
      codex-config:
        required: true
      codex-auth:
        required: false

jobs:
  authorize:
    # Reads only repository metadata, which every job token may read.
    permissions: {}
    if: inputs.authorize
    uses: ./.github/workflows/authorize.yml
    with:
      runs-on: ${{ inputs.runs-on }}

  agent:
    name: review
    needs: authorize
    # A disabled check admits the run; an enabled one must have found write access.
    if: always() && (needs.authorize.result == 'skipped' || needs.authorize.outputs.writer == 'true')
    # Low-trust events such as pull_request_target and issue_comment cannot save caches by default, which would drop every session snapshot.
    cache-mode: write
    concurrency:
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr || github.ref }}
      queue: max
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.codex-config }}
          codex-auth: ${{ secrets.codex-auth }}
          service-tier: ${{ inputs.service-tier }}
          session-key: ${{ inputs.session-key }}
