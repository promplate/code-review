name: review

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the permission check and the review.
        type: string
        default: ubuntu-latest
      authorize:
        description: Only repository writers may wake the agent. Checked before the run joins the review queue.
        type: boolean
        default: true
      service-tier:
        description: Provider service tier for reviews, such as `ultrafast` where the model advertises it.
        type: string
        default: ""
      session-key:
        description: Codex session this run continues; one per PR, or per branch for pushes, by default.
        type: string
        default: ""
    secrets:
      codex-config:
        required: true
      codex-auth:
        required: false

jobs:
  authorize:
    # Reads only repository metadata, which every job token may read.
    permissions: {}
    if: inputs.authorize
    uses: $/.github/workflows/authorize.yml
    with:
      runs-on: ${{ inputs.runs-on }}

  agent:
    needs: authorize
    # A disabled check admits the run; an enabled one must have found write access.
    # Discussion on a closed target has nothing left to review, while a pull request closing still gets its merge reviewed.
    if: ${{ !cancelled() && github.event.issue.state != 'closed' && (github.event.pull_request.state != 'closed' || github.event.action == 'closed') && (needs.authorize.result == 'skipped' || needs.authorize.outputs.writer == 'true') }}
    concurrency:
      # Runs that restore the same session queue behind one another, so the group follows the action's own session key:
      # `pr-<number>`, `issue-<number>` or `ref-<name>`, and an explicit key as given.
      # A run that ends up skipping still restores the session first, and unauthorized activity never reaches this job.
      group: code-review-${{ inputs.session-key || (github.event.client_payload.pr && format('pr-{0}', github.event.client_payload.pr)) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || (github.event.issue.number && (github.event.issue.pull_request && format('pr-{0}', github.event.issue.number) || format('issue-{0}', github.event.issue.number))) || format('ref-{0}', github.ref_name) }}
      queue: max
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.codex-config }}
          codex-auth: ${{ secrets.codex-auth }}
          service-tier: ${{ inputs.service-tier }}
          session-key: ${{ inputs.session-key }}
