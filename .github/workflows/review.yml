name: review

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner for the permission check and the review.
        type: string
        default: ubuntu-latest
      authorize:
        description: Only repository writers may wake the agent. Checked before the run joins the review queue.
        type: boolean
        default: true
      service-tier:
        description: Provider service tier for reviews, such as `ultrafast` where the model advertises it.
        type: string
        default: ""
      session-key:
        description: Codex session this run continues; one per PR, or per branch for pushes, by default.
        type: string
        default: ""
      broker:
        description: Service that exchanges the job's OIDC token for an installation token of the App and relays webhooks.
        type: string
        default: https://cf-webhook-sse-poc.admin-c9f.workers.dev
      encrypt-snapshots:
        description: Encrypt session and debug artifacts with a key the broker derives for this repository; requires a broker that serves `/snapshot-key`. Off, anyone who can read the repository can download them.
        type: boolean
        default: false
      setup:
        description: Shell to run on the runner before Codex is installed, for tools the review needs. It runs after Bun is installed, so a proxy or a Bun it provides does not apply to that install.
        type: string
        default: ""
      instructions:
        description: Instructions appended to the review prompt, for rules specific to this repository.
        type: string
        default: ""
      model-catalog-file:
        description: Path in this repository to a Codex model catalog, read from the default branch.
        type: string
        default: ""
      codex-config:
        description: Contents of a Codex config.toml. The matching secret takes precedence.
        type: string
        default: ""
      codex-config-file:
        description: Path in this repository to a Codex config.toml, read from the default branch; the `codex-config` secret takes precedence.
        type: string
        default: ""
      codex-auth-file:
        description: Path in this repository to a Codex auth.json, read from the default branch; the `codex-auth` secret takes precedence.
        type: string
        default: ""
      model-catalog:
        description: Contents of a Codex model catalog; takes precedence over `model-catalog-file`.
        type: string
        default: ""
    secrets:
      # Existing callers can pass the config as a secret.
      codex-config:
        required: false
      codex-auth:
        required: false

jobs:
  authorize:
    # Reads only repository metadata, which every job token may read.
    permissions: {}
    if: inputs.authorize
    uses: $/.github/workflows/authorize.yml
    with:
      runs-on: ${{ inputs.runs-on }}

  agent:
    needs: authorize
    # A disabled check admits the run; an enabled one must have found write access.
    # Discussion on a closed target has nothing left to review, while a pull request closing still gets its merge reviewed.
    if: ${{ !cancelled() && github.event.issue.state != 'closed' && (github.event.pull_request.state != 'closed' || github.event.action == 'closed') && (needs.authorize.result == 'skipped' || needs.authorize.outputs.writer == 'true') }}
    concurrency:
      # Runs that restore the same session queue behind one another, so the group follows the action's own session key:
      # `pr-<number>`, `issue-<number>` or `ref-<name>`, and an explicit key as given.
      # A run that ends up skipping still restores the session first, and unauthorized activity never reaches this job.
      group: code-review-${{ inputs.session-key || (github.event.client_payload.pr && format('pr-{0}', github.event.client_payload.pr)) || (github.event.inputs.pr && format('pr-{0}', github.event.inputs.pr)) || ((github.event.inputs.issue || github.event.issue.number) && (github.event.issue.pull_request && format('pr-{0}', github.event.issue.number) || format('issue-{0}', github.event.inputs.issue || github.event.issue.number))) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || format('ref-{0}', github.ref_name) }}
      queue: max
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: $/
        with:
          codex-config: ${{ secrets.codex-config || inputs.codex-config }}
          codex-auth: ${{ secrets.codex-auth }}
          service-tier: ${{ inputs.service-tier }}
          session-key: ${{ inputs.session-key }}
          broker: ${{ inputs.broker }}
          encrypt-snapshots: ${{ inputs.encrypt-snapshots }}
          debug-retention-days: ${{ vars.REVIEW_DEBUG_RETENTION_DAYS }}
          setup: ${{ inputs.setup }}
          instructions: ${{ inputs.instructions }}
          model-catalog-file: ${{ inputs.model-catalog-file }}
          model-catalog: ${{ inputs.model-catalog }}
          codex-config-file: ${{ inputs.codex-config-file }}
          codex-auth-file: ${{ inputs.codex-auth-file }}
